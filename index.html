<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The 4 Werhans</title>
<link rel="apple-touch-icon" href="./werhans-icon.png.PNG">
<style>
:root{color-scheme:light;--ink:#172b39;--muted:#526574;--accent:#174d55;--line:#d6e1e2;--paper:#fff;--canvas:#f2f6f5}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:17px/1.45 "DM Sans",system-ui,sans-serif}
main{max-width:850px;margin:auto;padding:20px clamp(16px,4vw,38px) 112px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:0 0 14px;margin-bottom:24px}
h1,h2,h3,p{margin:0}h1{font-size:1.2rem;letter-spacing:-.025em}h2{font-size:clamp(1.75rem,5vw,2.5rem);letter-spacing:-.045em;line-height:1.1}h3{font-size:1rem}
small{color:var(--muted);font-size:.78rem}
button,a,input,select{font:inherit}button,a{min-height:44px;color:var(--ink);font-weight:650;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--paper);cursor:pointer;text-decoration:none}
:focus-visible{outline:3px solid #347586;outline-offset:3px}button:active{transform:translateY(1px)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar a{display:inline-flex;align-items:center}
.new,.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.new{position:fixed;z-index:1;right:max(18px,calc((100vw - 780px)/2));bottom:max(18px,env(safe-area-inset-bottom));box-shadow:0 5px 18px #174d5540;padding:11px 20px}
.back{background:transparent;border-color:transparent;padding-left:0;margin-bottom:14px;color:var(--accent)}
.profile-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;max-width:560px;margin:32px auto}
.profile-picker .profile{display:grid;justify-items:center;gap:5px;background:none;border:0;padding:4px 8px}.profile strong{font-size:1.1rem}.profile>span:last-child{font-size:.85rem;color:var(--muted)}
.avatar{display:grid;place-items:center;width:clamp(76px,15vw,120px);aspect-ratio:1;border-radius:50%;background:var(--c);font-weight:750;font-size:clamp(1.65rem,5vw,2.5rem);overflow:hidden;border:3px solid #fff;box-shadow:0 4px 13px #17364222}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-nav{justify-content:center;margin-top:24px}
.list-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.task-group{margin:0 0 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.group-head{display:flex;align-items:center;gap:9px;padding:10px 14px;background:#e7efef;border-bottom:1px solid var(--line)}
.group-head .avatar{width:32px;font-size:.85rem;border-width:1px;box-shadow:none}
.group-head small{margin-left:auto}
.entry{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper)}
.entry+.entry{border-top:1px solid var(--line)}.entry-text{min-width:0;flex:1 1 150px;overflow-wrap:anywhere}.entry-text p{color:var(--muted);font-size:.86rem;margin-top:3px}
.entry .bar button{font-size:.87rem}.empty{color:var(--muted);padding:12px 14px}.undo{margin-top:10px}
dialog{margin:auto;width:min(calc(100% - 24px),470px);max-height:calc(100dvh - 24px);overflow:auto;border:0;border-radius:20px;background:var(--paper);color:var(--ink);padding:clamp(16px,5vw,26px)}
dialog::backdrop{background:#172b3980}dialog h2{font-size:1.65rem;margin-bottom:16px}dialog .bar{justify-content:flex-end;margin-top:18px}
form label,.settings label{display:grid;gap:5px;margin:10px 0;font-size:.9rem;font-weight:650}
form input,form select,.settings input{width:100%;min-width:0;max-width:100%;min-height:44px;padding:8px 10px;border:1px solid #aebfc4;border-radius:10px;background:#fff;color:var(--ink);font-size:16px}
.date-field{width:min(100%,14rem);grid-template-columns:minmax(0,1fr)}
#timeLabel{border:0;padding:0;margin:10px 0;min-width:0;width:min(100%,16rem)}
#timeLabel legend{padding:0;margin-bottom:5px;font-size:.9rem;font-weight:650}
.minute-buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:6px}
.minute-buttons button{padding:4px;font-size:.9rem}
input::-webkit-date-and-time-value{text-align:left;margin:0}
.settings-panel{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.settings-panel>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:12px 14px;font-weight:700;cursor:pointer;list-style:none}
.settings-panel>summary::-webkit-details-marker{display:none}
.settings-panel>summary::after{content:"";width:8px;height:8px;flex:none;margin-right:3px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
.settings-panel[open]>summary::after{transform:rotate(45deg)}
.settings-panel[open]>summary{border-bottom:1px solid var(--line)}
.settings-panel>div{padding:4px 14px 14px}
#frame{position:fixed;inset:0;z-index:4;background:#10241d;width:100%;height:100%;border:0;border-radius:0;padding:0}#frame img{width:100%;height:100%;object-fit:contain}[hidden]{display:none!important}

 .calendar-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.calendar-modes{display:flex;padding:3px;gap:3px;background:#e4eae8;border-radius:14px}
.calendar-modes button{border:0;background:transparent;padding-inline:14px}
.calendar-modes button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px #17364225;color:var(--accent)}
.month-panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #1736420d}
.month-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px clamp(10px,3vw,20px);background:#eaf4f1}
.month-toolbar h3{font-size:clamp(1rem,3vw,1.4rem);color:var(--accent)}
.month-toolbar .bar{gap:4px}
.month-toolbar button{padding:5px 8px;min-width:44px}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-inline:4px}
.weekday{text-align:center;padding:9px 0;font-size:.8rem;color:var(--muted);font-weight:650}
.month-day,.month-blank{min-width:0;min-height:clamp(46px,7vw,66px);border:0;border-top:1px solid var(--line);border-radius:0}
.month-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;font-variant-numeric:tabular-nums}
.month-day.weekend{background:#f6f8f7;color:#526574}
.month-day:focus-visible{outline-offset:-3px}
.day-number{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;line-height:1}
.month-day[aria-current="date"] .day-number{box-shadow:inset 0 0 0 2px var(--accent)}
.month-day[aria-pressed="true"] .day-number{color:white;background:var(--accent)}
.day-dots{display:flex;gap:3px;align-items:center;min-height:6px}
.day-dots i{width:6px;height:6px;background:var(--family-color);border-radius:50%}
#dayDialog{width:min(calc(100% - 24px),600px);max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:hidden}
#dayDialog[open]{display:flex;flex-direction:column;gap:12px}
.day-dialog-header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.day-dialog-header h2{font-size:1.15rem;margin:0}
#dayEvents{min-height:0;overflow:auto;overscroll-behavior:contain;margin:0}
.event-line{justify-content:flex-start;flex-wrap:nowrap;border-inline-start:5px solid var(--family-color)}
.event-line .event-time{min-width:5.4em;color:var(--accent);font-variant-numeric:tabular-nums;font-size:.88rem}
.event-line h4{margin:0;min-width:0;overflow-wrap:anywhere;font-size:1rem}
.task-section + .task-section{margin-top:26px}
.task-section>h3{margin-bottom:10px}
.task-stack{display:grid;gap:9px;margin-bottom:14px}
.task-owner{display:flex;align-items:center;gap:8px}
.task-owner .avatar{width:30px;font-size:.8rem;border-width:1px;box-shadow:none}
.task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.task-toggle{grid-column:1/-1;width:100%;min-height:64px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;overflow-wrap:anywhere}
.task-toggle small{display:block;margin-top:3px}
.task-check{width:24px;height:24px;flex:0 0 24px;border:2px solid var(--accent);border-radius:7px;display:grid;place-items:center;line-height:1}
.task-toggle[aria-pressed="true"]{background:#e7efef}
.task-toggle[aria-pressed="true"] .task-check{background:var(--accent);color:white}
.seen-task{grid-column:2;font-size:.85rem}

.fitted-tasks{display:grid;gap:6px}
.fitted-tasks .task-toggle{grid-column:1;height:var(--task-height);min-height:0;padding:4px 9px;gap:8px;overflow:auto}
.fitted-tasks .task-toggle>span:last-child{min-width:0;max-height:100%}
.fitted-tasks .task-toggle strong{display:block;line-height:1.1}
.fitted-tasks .task-toggle small{line-height:1.05}
.fitted-tasks .seen-task{padding-inline:7px}
.task-pages{margin-top:8px}
main:has(.fitted-tasks){padding-bottom:68px}
main:has(.fitted-tasks) .list-head{margin-bottom:10px}

#attendeeField{border:0;margin:12px 0;padding:0;min-width:0}
#attendeeField legend{font-weight:650;font-size:.9rem;padding:0;margin-bottom:6px}
#attendeeChoices{display:flex;flex-wrap:wrap;gap:6px}
.attendee-choice{display:flex;align-items:center;gap:5px;padding:5px 8px;font-size:.85rem}
.attendee-choice[aria-pressed="true"]{background:#eaf4f1;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.attendee-choice[aria-pressed="true"]::after{content:"✓";color:var(--accent)}
.attendee-choice .avatar,.event-people .avatar{width:26px;font-size:.75rem;border:0;box-shadow:none}
button.event-line{border-block:0;border-inline-end:0;width:100%;text-align:left;border-radius:0;font-weight:inherit}
.event-copy{min-width:0;flex:1;overflow-wrap:anywhere}
.event-people{margin-inline-start:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:68px}
/* Calendar colors are independent of participant profile colors. */
:root{--family-color:#f4c638}
.family-key{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--muted);font-size:.84rem;font-weight:650}
.family-key::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--family-color)}

.profile-picker{position:relative;display:block;width:min(100%,500px);height:auto;aspect-ratio:1;margin:12px auto}
.profile-picker .profile{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:30%;padding:3px}
.profile-picker .avatar{width:clamp(50px,15vw,90px)}
.profile-picker .profile strong{font-size:clamp(.74rem,3.1vw,1rem)}
.profile-picker .profile small{line-height:1}
.shop-form{display:flex;flex-wrap:wrap;align-items:end;gap:8px;margin:16px 0}
.shop-form label{margin:0;flex:1 1 130px}
.shop-form label.shop-quantity{flex:0 1 100px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,95px),1fr));gap:8px;margin:10px 0 18px}
.shop-tile{display:grid;align-content:center;justify-items:center;gap:3px;min-height:80px;text-align:center;overflow-wrap:anywhere;font-size:.9rem}
.shop-tile span:first-child{font-size:1.65rem;line-height:1.2}
.shop-tile small{line-height:1.2}
.shop-open{background:#eaf4f1;border-color:#9ebfb8}
.shop-bought{background:#edf0f2}
.shop-tabs{margin:16px 0 10px}
.shop-tabs button[aria-pressed="true"]{background:var(--accent);color:white}
.shop-category{margin-top:14px}

.shop-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr))}
.shop-list .shop-tile{min-height:92px}
.shop-list[data-density="medium"]{grid-template-columns:repeat(auto-fill,minmax(min(100%,94px),1fr));gap:6px}
.shop-list[data-density="medium"] .shop-tile{min-height:74px;padding:5px;font-size:.85rem}
.shop-list[data-density="high"]{grid-template-columns:repeat(auto-fill,minmax(min(100%,72px),1fr));gap:5px}
.shop-list[data-density="high"] .shop-tile{min-height:60px;padding:4px;font-size:.75rem}
.shop-list[data-density="high"] .shop-tile span:first-child{font-size:1.25rem}
#screen details{margin-top:8px}
#screen summary{padding:9px 0;min-height:44px;cursor:pointer;font-weight:650}

:root{--ink:#19243b;--muted:#4d5c72;--accent:#284bb0;--line:#d5ddea;--canvas:#f3f6fc}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 2%,#e1eaff,transparent 36rem),var(--canvas);min-height:100dvh}
header{align-items:baseline}
h1{font-size:clamp(1.15rem,4vw,1.55rem);letter-spacing:-.045em}
header small{text-align:right}
.profile-picker{width:min(100%,480px);max-width:none;isolation:isolate;margin:12px auto 6px}
.profile-picker::before{content:"";position:absolute;z-index:-1;inset:15%;border:1px solid #aabce2;border-radius:50%;background:radial-gradient(circle,#eaf0ff,transparent 67%)}
.profile-picker .profile{width:32%;gap:3px;line-height:1.2}
.profile-picker .profile>span:last-child{font-size:.73rem}
.profile-picker .avatar{width:clamp(52px,15vw,94px);border-color:#f8faff;box-shadow:0 5px 15px #223d692e}
.profile-nav{margin-top:8px}
.profile-nav button{background:#ffffffcf}
.hub-icon{display:block;position:relative;width:24px;height:21px;border:2px solid currentColor;border-radius:4px}
.hub-icon-calendar::before{content:"";position:absolute;inset:4px 0 auto;border-top:2px solid}
.hub-icon-calendar::after{content:"";position:absolute;top:-5px;left:4px;width:10px;height:6px;border-inline:2px solid}
.hub-icon-basket{height:15px;margin-top:5px}
.hub-icon-basket::before{content:"";position:absolute;top:-10px;left:4px;width:10px;height:8px;border:2px solid;border-bottom:0;border-radius:8px 8px 0 0}
.new{border-radius:999px;box-shadow:0 6px 20px #284bb04d}
.month-toolbar,.shop-open,.task-toggle[aria-pressed="true"]{background:#e8efff}
.shop-open{border-color:#a2b7e6}
dialog{box-shadow:0 16px 60px #18233b45}
@media(prefers-reduced-motion:no-preference){
  button{transition:background-color .15s,border-color .15s,box-shadow .15s}
  .profile-picker .avatar{transition:scale .15s,box-shadow .15s}
  .profile-picker .profile:active .avatar{scale:.93}
  .shop-tile:active{scale:.98}
}
@media(max-width:420px){
  header{gap:5px;flex-wrap:wrap;margin-bottom:14px}
  .profile-picker .profile strong{font-size:clamp(.68rem,3.1vw,.9rem)}
  .profile-nav button{padding-inline:10px}
}
.product-icon svg{display:block;width:1.55em;height:1.55em}

main:has(.profile-picker){max-width:1080px}
.profile-picker .profile{transition:left .22s ease,top .22s ease}
@media(min-width:700px){
  .profile-picker{width:min(100%,960px,calc(100svh - 190px))}
  .profile-picker .avatar{width:clamp(104px,13vw,144px)}
  .profile-picker .profile strong{font-size:1.15rem}
  .profile-picker .hub-icon{scale:1.25}
}
@media(max-width:699px){
  .profile-picker{touch-action:pan-y}
}
@media(prefers-reduced-motion:reduce){
  .profile-picker .profile{transition:none}
}

.profile-picker{--hub-size:clamp(52px,15vw,94px)}
.profile-picker::before{inset:13% 17% 21%}
.profile-picker .profile,.profile-picker .profile:active{
  transform:translate(-50%,calc(var(--hub-size) / -2));
  padding-block:0;
}
.profile-picker .avatar{width:var(--hub-size);height:var(--hub-size)}
@media(min-width:700px){
  .profile-picker{--hub-size:clamp(90px, min(13vw,16svh),144px)}
}

.fitted-tasks .task-toggle{
  background:#edf3ff;border:2px solid #647da7;color:#182d50;
  touch-action:manipulation;
}
.fitted-tasks .task-toggle[aria-pressed="true"]{
  background:#d9eadf;border-color:#52765e;color:#193e29;
}
.fitted-tasks .task-toggle[aria-pressed="true"] small{color:#305940}
.fitted-tasks .task-toggle[aria-pressed="true"] .task-check{background:#24603d;border-color:#24603d}
.fitted-tasks .task-toggle:active{transform:none;box-shadow:inset 0 0 0 2px currentColor}

main:has(.profile-picker){max-width:1250px}
main:has(.profile-picker)>header{display:none}
.profile-picker{width:min(100%,560px);margin:4px auto 0}
.hub-title{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:42%;text-align:center;font-size:clamp(1.1rem,4.8vw,2.8rem);
  line-height:1.1;pointer-events:none;
}
.app-version{text-align:center;margin-top:16px}
@media(min-width:700px){
  .profile-picker{width:min(100%,1080px, max(420px, calc(100svh - 140px)))}
  .profile-picker{--hub-size:clamp(104px,min(15vw,20svh),168px)}
}
main:has(.fitted-tasks) .app-version{margin-top:4px}

.profile-picker .profile>.shopping-count{
  position:absolute;top:calc(var(--hub-size) * .15);left:calc(50% + var(--hub-size) * .35);
  transform:translate(-50%,-50%);
  min-width:1.5rem;height:1.5rem;padding:0 .28rem;
  display:grid;place-items:center;border-radius:999px;
  border:2px solid white;background:#174b3c;color:white;
  font-size:.75rem;font-weight:750;line-height:1;
  pointer-events:none;
}
main:has(.profile-picker){
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding-bottom:calc(max(18px,env(safe-area-inset-bottom)) + 56px);
}
main:has(.profile-picker)>#screen{flex:1;display:flex;flex-direction:column}
main:has(.profile-picker) .profile-picker{margin:auto auto;flex:none}
main:has(.profile-picker) .profile-nav{margin:12px 0 0}
main:has(.profile-picker) .app-version{margin-top:6px}
@media(display-mode:standalone){
  main{padding-top:calc(20px + env(safe-area-inset-top,0px))}
  main:has(.profile-picker){padding-top:calc(20px + env(safe-area-inset-top,0px))}
}
.shift-menu{margin:8px 0 12px}
.shift-menu summary{width:fit-content;padding:10px 0;cursor:pointer;font-weight:650}
@media(max-width:699px) and (orientation:portrait) and (min-height:540px){
  main:has(.calendar-view){height:100dvh;padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:calc(68px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
  main:has(.calendar-view)>header{display:none}
  main:has(.calendar-view)>#screen,.calendar-view{display:flex;flex-direction:column;flex:1;min-height:0}
  #screen:has(.calendar-view)>.back{align-self:flex-start;margin:0;flex:none}
  .calendar-header{gap:6px;margin-bottom:4px}
  .calendar-header h2{font-size:clamp(1.2rem,5.5vw,1.65rem)}
  .shift-menu{margin:0 0 4px}
  .shift-menu summary{padding:4px 0}
  .calendar-view>[role="status"]{font-size:.78rem}
  .month-toolbar{padding:3px 6px;gap:4px}
  .weekday{padding:3px 0}
  .month-day,.month-blank{min-height:clamp(28px,4.7dvh,44px)}
  .day-number{width:23px;height:23px}
  .day-dots{min-height:4px}
  .day-dots i{width:4px;height:4px}
  main:has(.calendar-view) .app-version{margin-top:3px}
  .calendar-view:has(.shift-menu[open]){overflow:auto}
}
.calendar-legend{display:flex;gap:4px 12px;flex-wrap:wrap}
.family-key::before,.day-dots i{background:var(--event-color,var(--family-color))}
.event-line{border-inline-start-color:var(--event-color,var(--family-color))}
.shopping-item{display:grid;gap:4px;min-width:0}.shopping-item>button:last-child{font-size:.72rem;padding:4px 6px;min-height:32px}.settings input[type=checkbox]{width:24px;min-height:24px}
#screen .settings-panel > summary{padding:12px clamp(18px,4vw,24px);min-height:48px}
.settings-panel > div{padding:8px clamp(18px,4vw,24px) 16px}
body[data-custom-background]{isolation:isolate}
body[data-custom-background]::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:var(--design-background) center / cover no-repeat;
  opacity:var(--design-strength);
}
.design-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(112px,45%),1fr));gap:8px;margin-block:10px 16px}
.design-choice{display:grid;gap:5px;align-content:start;min-width:0;padding:6px;text-align:left;font-size:.8rem}
.design-choice[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--accent)}
.design-swatch{display:block;height:34px;border:1px solid #19243b18;border-radius:6px;background:var(--swatch)}
.settings input.design-strength{padding:0;accent-color:var(--accent);touch-action:pan-y}
.design-status{margin-top:8px}

.calendar-help{font-size:.9rem;color:var(--muted);margin-bottom:10px}
.calendar-view{background:#f8fafc;border-radius:18px;padding:14px}
.week-grid .month-day{min-height:88px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:5px}

const names=['Matze','Sindy','Philipp','Robin'], colors=['#bedbff','#f7c8b9','#f6dc91','#c7e5b7'];
const el=id=>document.getElementById(id), screen=el('screen'), editor=el('editor');
const state=JSON.parse(localStorage.getItem('familienplaner-v1')||'null')||{items:[],avatars:{},wait:300,interval:30};

let view='home', undo, idle, ticker, photos=[];

  if(next==='home'||next==='shopping')refreshShopping();

  if(next==='calendar'&&dayforceKey)refreshDayforce(dayforceKey);
}
function avatar(name,parent){
  const photo=state.avatars[name];
  const icon=node('span',photo?'':name[0],parent);
  icon.className='avatar';
  icon.style.setProperty('--c',colors[names.indexOf(name)]);

const deviceProfileKey='werhans-device-profile-v1';
const deviceHandKey='werhans-device-hand-v1';
let deviceHand='right';
try{if(localStorage.getItem(deviceHandKey)==='left')deviceHand='left';}catch{}
let deviceProfile='';
try{
  const stored=localStorage.getItem(deviceProfileKey);
  if(names.includes(stored))deviceProfile=stored;
}catch{}
function renderDeviceProfileSettings(area){
  const section=settingsPanel('Mein Profil',area);
  const label=node('label','Wer nutzt dieses Gerät?',section);
  const select=node('select','',label);
  const shared=node('option','Gemeinsam genutzt',select);shared.value='';
  for(const name of names){const option=node('option',name,select);option.value=name;}
  select.value=deviceProfile;
  const handLabel=node('label','Mit welcher Hand bedienst du dein Handy?',section);
  const handSelect=node('select','',handLabel);
  for(const [value,text] of [['right','Rechtshänder · Profil unten rechts'],['left','Linkshänder · Profil unten links']]){
    const option=node('option',text,handSelect);option.value=value;
  }
  handSelect.value=deviceHand;
  handSelect.disabled=!deviceProfile;
  node('small','Das ausgewählte Profil erscheint auf der Startseite größer. Die Auswahl gilt für dieses Gerät.',section);
  const status=node('p','',section);status.setAttribute('role','status');
  select.onchange=()=>{
    const previous=deviceProfile;
    try{
      localStorage.setItem(deviceProfileKey,select.value);
      deviceProfile=select.value;
      handSelect.disabled=!deviceProfile;
      status.textContent=deviceProfile?'Profil für dieses Gerät gespeichert.':'Gemeinsame Nutzung gespeichert.';
    }catch{
      select.value=previous;
      status.textContent='Die Auswahl konnte auf diesem Gerät nicht gespeichert werden.';
    }
  };
  handSelect.onchange=()=>{
    try{
      localStorage.setItem(deviceHandKey,handSelect.value);
      deviceHand=handSelect.value;
      status.textContent='Handbedienung für dieses Gerät gespeichert.';
    }catch{
      handSelect.value=deviceHand;
      status.textContent='Die Auswahl konnte auf diesem Gerät nicht gespeichert werden.';
    }
  };
}
function preferredProfileRotation(name,hand){
  const index=name==='Robin'?5:names.indexOf(name);

  if (stored && (designThemes.has(stored.theme) || stored.theme === 'photo')) design.theme = stored.theme;
  if (stored && Number.isFinite(stored.strength)) design.strength = Math.max(0, Math.min(100, stored.strength));
} catch {}

function applyDesign(){
  const theme = designThemes.get(design.theme);
  const gradient = theme?.gradient ?? (photoURL ? 'url("' + photoURL + '")' : '');
  document.body.toggleAttribute('data-custom-background', Boolean(gradient) && design.theme !== 'standard');
  const wash = theme?.dark || design.theme === 'photo' ? 'linear-gradient(#f3f6fca6,#f3f6fca6),' : '';
  document.body.style.setProperty('--design-background', wash + gradient);
  document.body.style.setProperty('--design-strength', design.strength / 100);
}

function saveDesign(){
  localStorage.setItem(designKey, JSON.stringify(design));
  applyDesign();
}

function photoTransaction(mode, operation){
  designDB ??= new Promise((resolve, reject)=>{
    const request = indexedDB.open('werhans-design', 1);
    request.onupgradeneeded = ()=>request.result.createObjectStore('background');
    request.onsuccess = ()=>resolve(request.result);
    request.onerror = ()=>reject(request.error);
  });
  return designDB.then(db=>new Promise((resolve, reject)=>{
    const transaction = db.transaction('background', mode);
    const request = operation(transaction.objectStore('background'));
    transaction.oncomplete = ()=>resolve(request.result);
    transaction.onabort = transaction.onerror = ()=>reject(transaction.error || request.error);
  }));
}

async function prepareBackgroundPhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 1920 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#f3f6fc';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve=>canvas.toBlob(resolve, 'image/jpeg', .84));
    if (!blob) throw new Error('Foto konnte nicht verarbeitet werden.');
    return blob;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function renderShoppingSettings(area){
  const section=settingsPanel('Einkaufsliste',area);
  const label=node('label','Gemeinsame Einkaufsliste synchronisieren',section);
  const toggle=node('input','',label);toggle.type='checkbox';toggle.checked=shoppingEnabled();
  const status=node('p','',section);status.setAttribute('role','status');
  const pushButton=button('Einkaufsbenachrichtigungen aktivieren',enablePush,section);
  const muteButton=button('Einkaufsbenachrichtigungen ausschalten',disablePush,section);
  pushButton.disabled=true;
  muteButton.disabled=true;
  const pushState=node('p','',section);
  async function preparePush(){
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){
      pushState.textContent='Öffne den Planer über das Home-Bildschirm-Symbol, um Push einzurichten.';
      return;
    }
    try{
      pushRegistration=await navigator.serviceWorker.register('./werhans-push.js');
      await navigator.serviceWorker.ready;
      const subscription=await pushRegistration.pushManager.getSubscription();
      muteButton.disabled=!subscription;
      pushState.textContent=subscription?'Push ist auf diesem Gerät eingerichtet.':'Push ist auf diesem Gerät ausgeschaltet.';
      if(!syncTokens.family){pushButton.disabled=true;return}
      const result=await shoppingRequest();
      shoppingPublicKey=result.publicKey;
      pushButton.disabled=!shoppingPublicKey;
      if(!shoppingPublicKey)pushState.textContent='Die Push-Schlüssel am Server fehlen noch.';
    }catch(error){pushState.textContent=error.message;}
  }
  async function enablePush(){
    pushButton.disabled=true;
    try{
      const subscription=await pushRegistration.pushManager.subscribe({
        userVisibleOnly:true,applicationServerKey:pushKeyBytes(shoppingPublicKey)
      });
      try{await shoppingRequest('subscribe',{subscription:subscription.toJSON()});}
      catch(error){throw error;}
      muteButton.disabled=false;
      pushState.textContent='Einkaufsbenachrichtigungen sind aktiviert.';
    }catch(error){pushState.textContent=error.message;}
    finally{pushButton.disabled=false;}
  }
  async function disablePush(){
    muteButton.disabled=true;
    try{
      const subscription=await pushRegistration.pushManager.getSubscription();
      // Das Browser-Abo wird auch von Kalender-Erinnerungen verwendet.
      if(syncTokens.family)await shoppingRequest('unsubscribe');
      pushState.textContent='Einkaufsbenachrichtigungen sind ausgeschaltet.';
    }catch(error){pushState.textContent=error.message;muteButton.disabled=false;}
  }
  toggle.onchange=async()=>{
    toggle.disabled=true;
    try{
      if(toggle.checked){
        const result=await shoppingRequest();
        applyShopping(result.items);
        localStorage.setItem(shoppingEnabledKey,'1');
        status.textContent='Gemeinsame Liste aktiviert. Die bisherige Liste bleibt auf diesem Gerät.';
      }else{
        ++shoppingReadVersion;
        localStorage.removeItem(shoppingEnabledKey);
        status.textContent='Die lokale Einkaufsliste ist aktiv.';
      }
    }catch(error){toggle.checked=shoppingEnabled();status.textContent=error.message;}
    finally{toggle.disabled=false;}
  };
  preparePush();
}

const shoppingRouteKey='werhans-shopping-route-v1';
const routeCategories=[...groceryCatalog.map(([name])=>name),'Weitere Artikel'];
const suggestedRoute=['Obst','Gemüse','Brot & Backwaren','Fleisch & Fisch','Kühlregal','Vorrat','Getränke','Haushalt & Tiere','Tiefkühl','Weitere Artikel'];
let shoppingRoute={store:'Aldi',orders:{Aldi:[...suggestedRoute],Lidl:[...suggestedRoute]}};
try{
  const saved=JSON.parse(localStorage.getItem(shoppingRouteKey));
  if(saved&&['Aldi','Lidl','Ohne Sortierung'].includes(saved.store))shoppingRoute.store=saved.store;
  for(const store of ['Aldi','Lidl']){
    const order=saved?.orders?.[store];
    if(Array.isArray(order)){
      shoppingRoute.orders[store]=[...new Set(order.filter(name=>routeCategories.includes(name)))];
      for(const name of suggestedRoute)if(!shoppingRoute.orders[store].includes(name))shoppingRoute.orders[store].push(name);
    }
  }
}catch{}
const groceryGroups=new Map(groceryCatalog.flatMap(([category,items])=>items.map(item=>[groceryProductKey(item.title),category])));
for(const title of ['Apfelmus','Konfitüre','Honig','Konserven'])groceryGroups.set(groceryProductKey(title),'Vorrat');
function groceryGroup(item){
  return groceryGroups.get(groceryProductKey(item.title))||'Weitere Artikel';
}
function sortShoppingRoute(items){
  if(shoppingRoute.store==='Ohne Sortierung')return items;
  const order=shoppingRoute.orders[shoppingRoute.store];
  return items.slice().sort((a,b)=>order.indexOf(groceryGroup(a))-order.indexOf(groceryGroup(b)));
}

async function refreshDayforce(key){
  if(dayforceLoading)return;
  const settingsOpen=view==='settings'&&Boolean(el('shiftSettings')?.open);
  dayforceLoading=true;
  dayforceStatus='Schichten werden geladen …';
  render();
  if(settingsOpen&&view==='settings')el('shiftSettings').open=true;
  try {
    const response=await fetch('https://werhans-kalender.mathiaswerhan.workers.dev/dayforce',{
      headers:{Authorization:'Bearer '+key},
      cache:'no-store',
      redirect:'error',
    });
    if(response.status===401){
      clearDayforceAccess();
      throw new Error('Familien-Zugangsschlüssel wurde abgelehnt.');
    }
    if(!response.ok)throw new Error('Schichten konnten nicht geladen werden.');
    const data=await response.json();
    const day=/^\d{4}-\d{2}-\d{2}$/;
    const clock=/^([01]\d|2[0-3]):[0-5]\d$/;
    if(!Array.isArray(data.shifts)||!data.shifts.every(shift=>
      shift&&day.test(shift.day)&&day.test(shift.endDay)&&clock.test(shift.clock)&&clock.test(shift.endClock)
    ))throw new Error('Der Kalenderabruf hat unerwartete Daten geliefert.');
    dayforceKey=key;
    let remembered=true;
    try { localStorage.setItem(dayforceStorageKey,key); } catch { remembered=false; }
    dayforceShifts=data.shifts.map(shift=>({...shift,kind:'Termin',title:'Sindy · Lidl',dayforce:true}));
    dayforceStatus=data.shifts.length+' Schichten geladen.'+(data.skipped?' Übersprungen: '+data.skipped+'.':'')+
      (remembered?'':' Der Schlüssel konnte auf diesem Gerät nicht gespeichert werden.');
  } catch(error) {
    dayforceStatus=error.message||'Schichten konnten nicht geladen werden.';
  } finally {
    dayforceLoading=false;
    if(view==='calendar'||view==='settings'){
      render();
      if(settingsOpen&&view==='settings')el('shiftSettings').open=true;
    }
  }
}

const syncScopes=['family','couple'];
const syncKey=scope=>'werhans-events-'+scope;
const syncTokens=Object.fromEntries(syncScopes.map(scope=>[scope,localStorage.getItem(syncKey(scope))||'']));
const sharedItems={family:[],couple:[]};
let syncStatus='';
async function sharedRequest(scope,method='GET',id='',data){
  const token=syncTokens[scope];
  if(!token)throw new Error('Aktiviere zuerst den Zugang unter Einstellungen → Kalendersynchronisation.');
  const response=await fetch('https://werhans-kalender.mathiaswerhan.workers.dev/events/'+scope+(id?'/'+id:''),{
    method,headers:{Authorization:'Bearer '+token,...(data?{'Content-Type':'application/json'}:{})},
    body:data?JSON.stringify(data):undefined,signal:AbortSignal.timeout(10000)
  });
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'Kalenderanfrage fehlgeschlagen.');
  return result;
}
let refreshGeneration=0;
async function refreshShared(){
  const generation=++refreshGeneration;
  const results=await Promise.allSettled(syncScopes.map(async scope=>{
    const result=syncTokens[scope]?await sharedRequest(scope):{events:[]};
    return result.events.map(item=>({...item,calendarScope:scope}));
  }));
  if(generation!==refreshGeneration)return;
  const previous=JSON.stringify([syncStatus,sharedItems]);
  syncStatus='';
  results.forEach((result,index)=>{
    const scope=syncScopes[index];
    if(result.status==='fulfilled')sharedItems[scope]=result.value;
    else{
      sharedItems[scope]=[];
      syncStatus+=' '+calendarTypes[scope].label+' konnte nicht geladen werden.';
    }
  });
  if(view==='calendar'&&!editor.open&&previous!==JSON.stringify([syncStatus,sharedItems]))render();
}
async function calendarPushRequest(scope, data) {
  if(!syncTokens[scope])throw new Error('Speichere zuerst den Kalenderzugang unter Kalendersynchronisation.');
  const response=await fetch('https://werhans-kalender.mathiaswerhan.workers.dev/calendar-push/'+scope,{
    method:data?'PUT':'GET',headers:{Authorization:'Bearer '+syncTokens[scope],...(data?{'Content-Type':'application/json'}:{})},
    body:data?JSON.stringify({...data,device:shoppingDevice()}):undefined,signal:AbortSignal.timeout(15000)
  });
  let result;try{result=await response.json();}catch{throw new Error('Zuerst den neuen Kalender-Worker einrichten.');}
  if(!response.ok)throw new Error(result.error||'Kalender-Erinnerungen nicht erreichbar.');
  return result;
}

  const section=settingsPanel('Kalender-Erinnerungen',area);
  node('p','Hier aktivierst du Erinnerungen für dieses Gerät.',section);
  node('small','Ohne ausgewählte Teilnehmer werden alle angemeldeten Geräte dieses Kalenders erinnert. Sonst nur die ausgewählten Personen. Ganztägige Termine beziehen sich auf 09:00 Uhr.',section);
  for(const scope of syncScopes) {
    node('h3',calendarTypes[scope].label,section);

    const profile=node('select','',label);
    const key='werhans-calendar-push-'+scope;
    for(const name of ['',...(scope==='couple'?['Matze','Sindy']:names)]) {
      const option=node('option',name||'Person wählen',profile);option.value=name;
    }

      try {
        if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error('Öffne den Planer über das Symbol auf dem Home-Bildschirm.');
        // Register before subscribe; permission request stays in the user gesture.
        const permission=await Notification.requestPermission();
        if(permission!=='granted')throw new Error('Bitte Mitteilungen für den Planer erlauben.');
        const registration=await navigator.serviceWorker.register('./werhans-push.js');
        await navigator.serviceWorker.ready;
        const config=await calendarPushRequest(scope);

        const subscription=await registration.pushManager.getSubscription()||await registration.pushManager.subscribe({
          userVisibleOnly:true,applicationServerKey:pushKeyBytes(config.publicKey)
        });
        await calendarPushRequest(scope,{action:'subscribe',profile:profile.value,subscription:subscription.toJSON()});
        localStorage.setItem(key,profile.value);
        status.textContent='Auf diesem Gerät für '+profile.value+' aktiviert. Der Zeitplan muss auch bei Cloudflare eingerichtet sein.';
      } catch(error){status.textContent=error.message;}

    },section);

      enable.disabled=disable.disabled=true;
      try {
        await calendarPushRequest(scope,{action:'unsubscribe'});
        localStorage.removeItem(key);
        status.textContent='Auf diesem Gerät ausgeschaltet.';
      }catch(error){status.textContent=error.message;}
      finally{enable.disabled=disable.disabled=false;}
    },section);

  const custom=event&&reminder.value==='custom';
  el('reminderField').hidden=!event;
  el('customReminder').hidden=!custom;
  reminderAmount.disabled=!custom;
  reminderAmount.required=custom;
}
reminder.onchange=reminderFields;
function fields(){
  el('calendarScopeLabel').hidden=el('kind').value!=='Termin';
  reminderFields();
  const event=el('kind').value==='Termin';
  el('whoLabel').hidden=event;
  el('attendeeField').hidden=!event;
  el('allDayLabel').hidden=!event;
  el('allDay').disabled=!event;
  el('timeLabel').hidden=!event||el('allDay').checked;
  clock.disabled=!event||el('allDay').checked;
  clock.setCustomValidity('');
  el('day').required=event;
  el('dayCaption').textContent=event?'Datum':'Fällig am (optional)';
}
el('kind').onchange=()=>{fields();arrangeCalendarForm()};
el('allDay').onchange=fields;

let quickEventEntry=false;
function arrangeCalendarForm(){
  const form=el('form');
  const event=el('kind').value==='Termin';
  const title=el('titleInput').closest('label');
  const actions=el('cancel').parentElement;
  const scope=el('calendarScopeLabel');
  const reminderSection=el('reminderField');
  let extra=el('calendarExtras');
  if(!extra){
    form.insertBefore(scope,el('whoLabel'));
    form.insertBefore(el('allDayLabel'),actions);
    form.insertBefore(el('timeLabel'),actions);
    extra=node('details','',form);extra.id='calendarExtras';
    node('summary','Weitere Angaben',extra);
    extra.append(el('attendeeField'),reminderSection);
  }
  form.insertBefore(extra,actions);
  form.insertBefore(scope,extra);
  extra.hidden=!event;
  extra.open=false;
  title.firstChild.textContent=event?'Was steht an?':'Was ist zu tun?';
  el('dayCaption').textContent=event?'Datum':'Bis wann? (optional)';
  el('editorTitle').textContent=event?(editingEvent?'Termin bearbeiten':'Neuer Termin'):'Neue Aufgabe';
  el('kindLabel').hidden=Boolean(editingEvent)||quickEventEntry;
  if(event){
    el('calendarScopeLabel').querySelector('small').textContent=
      '';
  }
}

function openEditor(item=null,quickEvent=false){
  quickEventEntry=quickEvent;
  editingEvent=item;
  el('form').reset();
  el('editorTitle').textContent=item?'Termin bearbeiten':'Neuer Eintrag';
  el('kindLabel').hidden=Boolean(item);
  el('kind').value=item||view==='calendar'?'Termin':'Aufgabe';
  el('day').value=item?.day||(view==='calendar'?selectedDay:'');
  el('titleInput').value=item?.title||'';
  clock.value=item?.clock||'';
  el('allDay').checked=Boolean(item&&!item.clock);
  const minutes=item?.reminderMinutes;
  if(minutes){
    reminder.value=String(minutes);
    if(!reminder.value){
      reminder.value='custom';
      const unit=minutes%1440===0?1440:minutes%60===0?60:1;
      reminderUnit.value=String(unit);
      reminderAmount.value=String(minutes/unit);
    }
  }
  el('who').value=names.includes(view)?view:names[0];
  for(const [name,choice] of participantButtons){
    choice.replaceChildren();
    avatar(name,choice);
    node('span',name,choice);
    choice.setAttribute('aria-pressed',String(item?Boolean(item.participants?.includes(name)):view===name));
  }
  el('calendarScope').value=item?.calendarScope||'private';
  el('calendarScope').disabled=Boolean(item?.revision);
  fields();
  arrangeCalendarForm();
  editor.showModal();
}
el('add').onclick=()=>openEditor();
el('cancel').onclick=()=>editor.close();
editor.onclose=reset;
editor.addEventListener('cancel',event=>{
  if(el('cancel').disabled)event.preventDefault();
});
window.addEventListener('focus',()=>{if(view==='calendar')refreshShared()});
setInterval(()=>{if(view==='calendar'&&!document.hidden&&!editor.open)refreshShared()},30000);
el('form').onsubmit=async event=>{
  event.preventDefault();
  const title=el('titleInput').value.trim();
  if(!title)return;
  const kind=el('kind').value, who=el('who').value;
  const time=kind==='Termin'&&!el('allDay').checked?normalizeClock(clock.value):'';
  if(kind==='Termin'&&!el('allDay').checked&&clock.value.trim()&&!time){
    clock.setCustomValidity('Bitte eine Uhrzeit eingeben, zum Beispiel 0930 für 09:30.');
    clock.reportValidity();
    return;
  }
  const day=el('day').value;
  if(kind==='Termin'){
    const participants=names.filter(name=>participantButtons.get(name).getAttribute('aria-pressed')==='true');
    const reminderMinutes=reminder.value==='custom'?Number(reminderAmount.value)*Number(reminderUnit.value):Number(reminder.value);
    const details={title,day,clock:time,participants,reminderMinutes,calendarScope:el('calendarScope').value};
    if(details.calendarScope==='private' && reminderMinutes>0){
      alert('Push-Erinnerungen brauchen einen gemeinsamen Kalender. Wähle „Ganze Familie“ oder „Matze & Sindy“ – oder „Keine“ bei Erinnerung.');
      return;
    }
    if(syncScopes.includes(details.calendarScope)){
      if(editingEvent&&!editingEvent.revision&&!confirm('Diesen bisherigen Termin für '+calendarTypes[details.calendarScope].label+' freigeben?'))return;
      const form=el('form');
      const submit=form.querySelector('.primary');
      if(submit.disabled)return;
      const item=editingEvent;
      const id=item?.revision?item.id:crypto.randomUUID();
      submit.disabled=el('cancel').disabled=true;
      try{
        const result=await sharedRequest(details.calendarScope,'PUT',id,{...details,revision:item?.revision||0});
        if(item&&!item.revision){
          state.items=state.items.filter(entry=>entry!==item);
          save();
        }
        const entries=sharedItems[details.calendarScope];
        sharedItems[details.calendarScope]=[...entries.filter(entry=>entry.id!==id),
          {...details,id,kind,revision:result.revision}];
      }catch(error){
        alert(error.message);
        return;
      }finally{
        submit.disabled=el('cancel').disabled=false;
      }
    }else if(editingEvent)Object.assign(editingEvent,details);
    else state.items.push({id:Date.now(),kind,...details});
    selectedDay=day;
  }else{
    state.items.push({id:Date.now(),title,kind,who,status:'Offen',day,clock:''});
  }
  undo=null;
  save();
  editor.close();
  if(kind==='Aufgabe')taskFilter='Offen';
  go(kind==='Termin'?'calendar':who);
  showFeedback(kind==='Termin'?'Termin gespeichert.':'Aufgabe gespeichert.');
};

function showFrame(){if(!photos.length||editor.open)return;clearTimeout(idle);clearInterval(ticker);let index=0;el('frame').hidden=false;el('slide').src=photos[index];ticker=setInterval(()=>{index=(index+1)%photos.length;el('slide').src=photos[index]},state.interval*1000)}
function reset(){clearTimeout(idle);if(state.wait&&photos.length&&el('frame').hidden&&!editor.open)idle=setTimeout(showFrame,state.wait*1000)}
el('frame').onclick=()=>{clearInterval(ticker);el('frame').hidden=true;go('home')};for(const event of ['pointerdown','keydown','input','scroll'])document.addEventListener(event,reset,{passive:true});
let taskResizeTimer;
const activePointers=new Set();
let taskViewportWidth;
let taskViewportHeight;
function resizeTasks(){
  clearTimeout(taskResizeTimer);
  taskResizeTimer=setTimeout(()=>{
    if(activePointers.size||!(view==='all'||names.includes(view))||editor.open||!el('frame').hidden)return;
    const width=document.documentElement.clientWidth;
    const height=Math.round(window.visualViewport?.height||window.innerHeight);
    if(width===taskViewportWidth&&height===taskViewportHeight)return;
    render();
  },150);
}
window.addEventListener('pointerdown',event=>activePointers.add(event.pointerId),true);
for(const type of ['pointerup','pointercancel']){
  window.addEventListener(type,event=>{
    activePointers.delete(event.pointerId);
    resizeTasks();
  },true);
}
window.addEventListener('blur',()=>{activePointers.clear();resizeTasks()});
window.addEventListener('resize',resizeTasks);
window.addEventListener('resize',()=>requestAnimationFrame(fitCalendarView));
window.visualViewport?.addEventListener('resize',()=>requestAnimationFrame(fitCalendarView));
window.visualViewport?.addEventListener('resize',resizeTasks);
applyDesign();
photoTransaction('readonly', store=>store.get('photo')).then(blob=>{
  if (blob && !photoURL) photoURL = URL.createObjectURL(blob);
  applyDesign();
  updateDesignControls();
}).catch(()=>{});

render();
refreshShopping();
</script></body></html>

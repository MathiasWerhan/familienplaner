<style>

main{max-width:850px;margin:auto;padding:20px clamp(16px,4vw,38px) 112px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar a{display:inline-flex;align-items:center}
.new,.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.new{position:fixed;z-index:1;right:max(18px,calc((100vw - 780px)/2));bottom:max(18px,env(safe-area-inset-bottom));box-shadow:0 5px 18px #174d5540;padding:11px 20px}

.profile-picker .profile{display:grid;justify-items:center;gap:5px;background:none;border:0;padding:4px 8px}.profile strong{font-size:1.1rem}.profile>span:last-child{font-size:.85rem;color:var(--muted)}
.avatar{display:grid;place-items:center;width:clamp(76px,15vw,120px);aspect-ratio:1;border-radius:50%;background:var(--c);font-weight:750;font-size:clamp(1.65rem,5vw,2.5rem);overflow:hidden;border:3px solid #fff;box-shadow:0 4px 13px #17364222}

.profile-nav{justify-content:center;margin-top:24px}
.list-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.task-group{margin:0 0 14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}

.group-head .avatar{width:32px;font-size:.85rem;border-width:1px;box-shadow:none}
.group-head small{margin-left:auto}
.entry{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper)}
.entry+.entry{border-top:1px solid var(--line)}.entry-text{min-width:0;flex:1 1 150px;overflow-wrap:anywhere}.entry-text p{color:var(--muted);font-size:.86rem;margin-top:3px}
.entry .bar button{font-size:.87rem}.empty{color:var(--muted);padding:12px 14px}.undo{margin-top:10px}
dialog{margin:auto;width:min(calc(100% - 24px),470px);max-height:calc(100dvh - 24px);overflow:auto;border:0;border-radius:20px;background:var(--paper);color:var(--ink);padding:clamp(16px,5vw,26px)}
dialog::backdrop{background:#172b3980}dialog h2{font-size:1.65rem;margin-bottom:16px}dialog .bar{justify-content:flex-end;margin-top:18px}
form label,.settings label{display:grid;gap:5px;margin:10px 0;font-size:.9rem;font-weight:650}
form input,form select,.settings input{width:100%;min-width:0;max-width:100%;min-height:44px;padding:8px 10px;border:1px solid #aebfc4;border-radius:10px;background:#fff;color:var(--ink);font-size:16px}
.date-field{width:min(100%,14rem);grid-template-columns:minmax(0,1fr)}
#timeLabel{border:0;padding:0;margin:10px 0;min-width:0;width:min(100%,16rem)}
#timeLabel legend{padding:0;margin-bottom:5px;font-size:.9rem;font-weight:650}
.minute-buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:6px}
.minute-buttons button{padding:4px;font-size:.9rem}

.settings-panel{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.settings-panel>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:12px 14px;font-weight:700;cursor:pointer;list-style:none}
.settings-panel>summary::-webkit-details-marker{display:none}
.settings-panel>summary::after{content:"";width:8px;height:8px;flex:none;margin-right:3px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
.settings-panel[open]>summary::after{transform:rotate(45deg)}
.settings-panel[open]>summary{border-bottom:1px solid var(--line)}
.settings-panel>div{padding:4px 14px 14px}

 .calendar-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.calendar-modes{display:flex;padding:3px;gap:3px;background:#e4eae8;border-radius:14px}

.month-panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #1736420d}

.month-toolbar .bar{gap:4px}

.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-inline:4px}
.weekday{text-align:center;padding:9px 0;font-size:.8rem;color:var(--muted);font-weight:650}
.month-day,.month-blank{min-width:0;min-height:clamp(46px,7vw,66px);border:0;border-top:1px solid var(--line);border-radius:0}
.month-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;font-variant-numeric:tabular-nums}
.month-day.weekend{background:#f6f8f7;color:#526574}
.month-day:focus-visible{outline-offset:-3px}
.day-number{display:grid;place-items:center;width:29px;height:29px;border-radius:50%;line-height:1}
.month-day[aria-current="date"] .day-number{box-shadow:inset 0 0 0 2px var(--accent)}
.month-day[aria-pressed="true"] .day-number{color:white;background:var(--accent)}
.day-dots{display:flex;gap:3px;align-items:center;min-height:6px}

.day-dialog-header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.day-dialog-header h2{font-size:1.15rem;margin:0}
#dayEvents{min-height:0;overflow:auto;overscroll-behavior:contain;margin:0}
.event-line{justify-content:flex-start;flex-wrap:nowrap;border-inline-start:5px solid var(--family-color)}
.event-line .event-time{min-width:5.4em;color:var(--accent);font-variant-numeric:tabular-nums;font-size:.88rem}
.event-line h4{margin:0;min-width:0;overflow-wrap:anywhere;font-size:1rem}
.task-section + .task-section{margin-top:26px}
.task-section>h3{margin-bottom:10px}
.task-stack{display:grid;gap:9px;margin-bottom:14px}
.task-owner{display:flex;align-items:center;gap:8px}
.task-owner .avatar{width:30px;font-size:.8rem;border-width:1px;box-shadow:none}
.task-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.task-toggle{grid-column:1/-1;width:100%;min-height:64px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;overflow-wrap:anywhere}
.task-toggle small{display:block;margin-top:3px}
.task-check{width:24px;height:24px;flex:0 0 24px;border:2px solid var(--accent);border-radius:7px;display:grid;place-items:center;line-height:1}
.task-toggle[aria-pressed="true"]{background:#e7efef}
.task-toggle[aria-pressed="true"] .task-check{background:var(--accent);color:white}
.seen-task{grid-column:2;font-size:.85rem}

.fitted-tasks{display:grid;gap:6px}

.fitted-tasks .task-toggle>span:last-child{min-width:0;max-height:100%}

.fitted-tasks .task-toggle small{line-height:1.05}
.fitted-tasks .seen-task{padding-inline:7px}
.task-pages{margin-top:8px}
main:has(.fitted-tasks){padding-bottom:68px}

#attendeeField{border:0;margin:12px 0;padding:0;min-width:0}

#attendeeChoices{display:flex;flex-wrap:wrap;gap:6px}
.attendee-choice{display:flex;align-items:center;gap:5px;padding:5px 8px;font-size:.85rem}
.attendee-choice[aria-pressed="true"]{background:#eaf4f1;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.attendee-choice[aria-pressed="true"]::after{content:"✓";color:var(--accent)}
.attendee-choice .avatar,.event-people .avatar{width:26px;font-size:.75rem;border:0;box-shadow:none}
button.event-line{border-block:0;border-inline-end:0;width:100%;text-align:left;border-radius:0;font-weight:inherit}
.event-copy{min-width:0;flex:1;overflow-wrap:anywhere}
.event-people{margin-inline-start:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:68px}
/* Calendar colors are independent of participant profile colors. */
:root{--family-color:#f4c638}
.family-key{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--muted);font-size:.84rem;font-weight:650}
.family-key::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--family-color)}

.profile-picker{position:relative;display:block;width:min(100%,500px);height:auto;aspect-ratio:1;margin:12px auto}
.profile-picker .profile{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:30%;padding:3px}
.profile-picker .avatar{width:clamp(50px,15vw,90px)}
.profile-picker .profile strong{font-size:clamp(.74rem,3.1vw,1rem)}
.profile-picker .profile small{line-height:1}
.shop-form{display:flex;flex-wrap:wrap;align-items:end;gap:8px;margin:16px 0}
.shop-form label{margin:0;flex:1 1 130px}
.shop-form label.shop-quantity{flex:0 1 100px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,95px),1fr));gap:8px;margin:10px 0 18px}
.shop-tile{display:grid;align-content:center;justify-items:center;gap:3px;min-height:80px;text-align:center;overflow-wrap:anywhere;font-size:.9rem}
.shop-tile span:first-child{font-size:1.65rem;line-height:1.2}
.shop-tile small{line-height:1.2}
.shop-open{background:#eaf4f1;border-color:#9ebfb8}
.shop-bought{background:#edf0f2}
.shop-tabs{margin:16px 0 10px}
.shop-tabs button[aria-pressed="true"]{background:var(--accent);color:white}
.shop-category{margin-top:14px}

.shop-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr))}
.shop-list .shop-tile{min-height:92px}
.shop-list[data-density="medium"]{grid-template-columns:repeat(auto-fill,minmax(min(100%,94px),1fr));gap:6px}
.shop-list[data-density="medium"] .shop-tile{min-height:74px;padding:5px;font-size:.85rem}
.shop-list[data-density="high"]{grid-template-columns:repeat(auto-fill,minmax(min(100%,72px),1fr));gap:5px}
.shop-list[data-density="high"] .shop-tile{min-height:60px;padding:4px;font-size:.75rem}
.shop-list[data-density="high"] .shop-tile span:first-child{font-size:1.25rem}
#screen details{margin-top:8px}
#screen summary{padding:9px 0;min-height:44px;cursor:pointer;font-weight:650}

:root{--ink:#19243b;--muted:#4d5c72;--accent:#284bb0;--line:#d5ddea;--canvas:#f3f6fc}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 2%,#e1eaff,transparent 36rem),var(--canvas);min-height:100dvh}
header{align-items:baseline}
h1{font-size:clamp(1.15rem,4vw,1.55rem);letter-spacing:-.045em}
header small{text-align:right}
.profile-picker{width:min(100%,480px);max-width:none;isolation:isolate;margin:12px auto 6px}
.profile-picker::before{content:"";position:absolute;z-index:-1;inset:15%;border:1px solid #aabce2;border-radius:50%;background:radial-gradient(circle,#eaf0ff,transparent 67%)}
.profile-picker .profile{width:32%;gap:3px;line-height:1.2}
.profile-picker .profile>span:last-child{font-size:.73rem}
.profile-picker .avatar{width:clamp(52px,15vw,94px);border-color:#f8faff;box-shadow:0 5px 15px #223d692e}
.profile-nav{margin-top:8px}
.profile-nav button{background:#ffffffcf}
.hub-icon{display:block;position:relative;width:24px;height:21px;border:2px solid currentColor;border-radius:4px}
.hub-icon-calendar::before{content:"";position:absolute;inset:4px 0 auto;border-top:2px solid}
.hub-icon-calendar::after{content:"";position:absolute;top:-5px;left:4px;width:10px;height:6px;border-inline:2px solid}
.hub-icon-basket{height:15px;margin-top:5px}
.hub-icon-basket::before{content:"";position:absolute;top:-10px;left:4px;width:10px;height:8px;border:2px solid;border-bottom:0;border-radius:8px 8px 0 0}
.new{border-radius:999px;box-shadow:0 6px 20px #284bb04d}
.month-toolbar,.shop-open,.task-toggle[aria-pressed="true"]{background:#e8efff}
.shop-open{border-color:#a2b7e6}
dialog{box-shadow:0 16px 60px #18233b45}
@media(prefers-reduced-motion:no-preference){
  button{transition:background-color .15s,border-color .15s,box-shadow .15s}

}
@media(max-width:420px){

}
.product-icon svg{display:block;width:1.55em;height:1.55em}

main:has(.profile-picker){max-width:1080px}

@media(min-width:700px){

}
@media(max-width:699px){
  .profile-picker{touch-action:pan-y}
}

.profile-picker{--hub-size:clamp(52px,15vw,94px)}
.profile-picker::before{inset:13% 17% 21%}

  transform:translate(-50%,calc(var(--hub-size) / -2));

}

}

main:has(.profile-picker){max-width:1250px}

.profile-picker{width:min(100%,560px);margin:4px auto 0}
.hub-title{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:42%;text-align:center;font-size:clamp(1.1rem,4.8vw,2.8rem);
  line-height:1.1;pointer-events:none;
}
.app-version{text-align:center;margin-top:16px}
@media(min-width:700px){
  .profile-picker{width:min(100%,1080px, max(420px, calc(100svh - 140px)))}

.calendar-legend{display:flex;gap:4px 12px;flex-wrap:wrap}

</style></head><body><main><header><h1>The 4 Werhans</h1></header><section id="screen"></section><footer class="app-version"><small>V43 · Lokale Daten und Kalenderabgleich</small></footer><button class="new" id="add">＋ Neu</button></main>

<script>

if(exampleIndex!==-1){
  state.items.splice(exampleIndex,1);

}
let view='home', undo, idle, ticker, photos=[];
function save(){localStorage.setItem('familienplaner-v1',JSON.stringify(state))}
function node(tag,txt,parent=screen){const n=document.createElement(tag);if(txt)n.textContent=txt;parent.append(n);return n}
function button(txt,fn,parent=screen){const b=node('button',txt,parent);b.onclick=fn;return b}
function go(next){
  view=next;taskPage=0;render();reset();
  if(next==='home'||next==='shopping')refreshShopping();
  if(next==='calendar')refreshShared();
  if(next==='calendar'&&dayforceKey)refreshDayforce(dayforceKey);
}
function avatar(name,parent){
  const photo=state.avatars[name];
  const icon=node('span',photo?'':name[0],parent);
  icon.className='avatar';
  icon.style.setProperty('--c',colors[names.indexOf(name)]);
  icon.setAttribute('aria-hidden','true');
  if(photo){const img=node('img','',icon);img.src=photo;img.alt=''}
}
function dateLabel(day){
  return day ? new Intl.DateTimeFormat('de-DE',{day:'numeric',month:'short',year:'numeric'}).format(new Date(day+'T12:00:00')) : '';
}
let taskPage=0;
function taskRow(item,parent){
  const done=item.status==='Erledigt';
  const row=node('div','',parent);
  row.className='task-row';
  function update(status){
    undo={item,status:item.status};
    if(status==='Erledigt')item.previousStatus=item.status;
    item.status=status;
    save();
    render();
    screen.querySelectorAll('.task-toggle').forEach(control=>{
      if(control.dataset.taskId===String(item.id))control.focus({preventScroll:true});
    });
  }
  const toggle=button('',()=>update(done?(item.previousStatus||'Offen'):'Erledigt'),row);
  toggle.className='task-toggle';
  toggle.dataset.taskId=String(item.id);
  toggle.setAttribute('aria-pressed',String(done));
  node('span',done?'✓':'',toggle).className='task-check';
  const copy=node('span','',toggle);
  node('strong',item.title,copy);
  const detail=[view==='all'?item.who:'',done?'Erledigt':'',item.day?'Fällig am '+dateLabel(item.day):'',item.status==='Gesehen'?'Gesehen':''].filter(Boolean).join(' · ');
  if(detail)node('small',detail,copy);
  if(!done&&item.status!=='Gesehen')button('Gesehen',()=>update('Gesehen'),row).className='seen-task';
}
let profileRotation=0;
function render(){
  el('add').hidden=view==='shopping';
  screen.replaceChildren();
  if(view==='home'){
    const grid=node('div');
    grid.className='grid profile-picker';
    node('h1','The 4 Werhans',grid).className='hub-title';
    const positions=Array.from({length:6},(_,index)=>{
      const angle=(index*60-120)*Math.PI/180;
      return [50+33*Math.cos(angle),46+33*Math.sin(angle)];
    });
    const circles=[];
    function positionCircle(control,index){
      const [x,y]=positions[(index+profileRotation)%positions.length];
      control.style.setProperty('--x',x+'%');
      control.style.setProperty('--y',y+'%');
    }
    function circle(action,index){
      const control=button('',action,grid);
      control.className='profile';
      circles[index]=control;
      positionCircle(control,index);
      return control;
    }
    let swipeStart=null;
    let suppressTapUntil=0;
    grid.addEventListener('touchstart',event=>{
      swipeStart=null;
      if(event.touches.length!==1||!window.matchMedia('(max-width:699px)').matches)return;
      const touch=event.touches[0];
      swipeStart={x:touch.clientX,y:touch.clientY,id:touch.identifier};
    },{passive:true});
    grid.addEventListener('touchcancel',()=>{swipeStart=null},{passive:true});
    grid.addEventListener('touchend',event=>{
      const start=swipeStart;
      swipeStart=null;
      if(!start)return;
      const touch=Array.from(event.changedTouches).find(item=>item.identifier===start.id);
      if(!touch)return;
      const dx=touch.clientX-start.x;
      const dy=touch.clientY-start.y;
      if(Math.abs(dx)<32||Math.abs(dx)<=Math.abs(dy))return;
      if(event.cancelable)event.preventDefault();
      suppressTapUntil=performance.now()+350;
      const center=grid.getBoundingClientRect();
      const direction=(dx>0)===(start.y<center.top+center.height/2)?1:-1;
      profileRotation=(profileRotation+positions.length+direction)%positions.length;
      circles.forEach(positionCircle);
    },{passive:false});
    grid.addEventListener('click',event=>{
      if(event.detail&&performance.now()<suppressTapUntil){
        event.preventDefault();
        event.stopPropagation();
      }
    },true);

      const b=circle(()=>go(name),name==='Robin'?5:index);

      badge.setAttribute('aria-hidden','true');
      node('strong',label,b);
      if(target==='shopping'){
        const count=displayedShopping().filter(item=>!item.done).length;

        b.setAttribute('aria-label',label+', '+count+(count===1?' offener Artikel':' offene Artikel'));
      }
    }
    const nav=node('nav');
    nav.className='bar profile-nav';
    button('Alle Aufgaben',()=>go('all'),nav);
    button('Einstellungen',()=>go('settings'),nav);
    return;
  }
  button('‹ Zur Profilauswahl',()=>go('home')).className='back';
  const area=node('section');
  if(view==='settings'){area.className='settings';
  node('h2','Einstellungen',area);renderSyncSettings(area);renderShoppingSettings(area);const profiles=settingsPanel('Profilbilder',area);for(const name of names){const l=node('label',name,profiles);const f=node('input','',l);f.type='file';f.accept='image/*';f.onchange=async()=>{if(!f.files[0])return;try{state.avatars[name]=await resize(f.files[0],240);save()}catch{alert('Dieses Foto konnte nicht gespeichert werden.')}}}const slides=settingsPanel('Bilderrahmen',area);const label=node('label','Fotos für den Bilderrahmen (bis zu 100)',slides);const upload=node('input','',label);upload.type='file';upload.accept='image/*';upload.multiple=true;const count=node('small',photos.length+' Fotos · für diese Sitzung',slides);upload.onchange=()=>{if(!upload.files.length)return;photos.forEach(URL.revokeObjectURL);photos=Array.from(upload.files).slice(0,100).map(f=>URL.createObjectURL(f));count.textContent=photos.length+' Fotos · für diese Sitzung';reset()};
for(const [key,label] of [['wait','Start nach Sekunden (0 = aus)'],['interval','Bildwechsel nach Sekunden']]){const l=node('label',label,slides),i=node('input','',l);i.type='number';i.min=key==='wait'?0:1;i.value=state[key];i.onchange=()=>{if(i.value!==''&&i.checkValidity()){state[key]=Number(i.value);save();reset()}else i.value=state[key]}}button('Diashow testen',()=>photos.length?showFrame():alert('Wähle zuerst Fotos aus.'),slides);return}

  if(view==='calendar'){area.className='calendar-view';renderCalendar(area);return}
  if(view==='shopping'){renderShopping(area);return}
  const head=node('div','',area);head.className='list-head';
  node('h2',view==='all'?'Alle Aufgaben':view+' · Aufgaben',head);
  const doneCount=state.items.filter(item=>item.kind==='Aufgabe'&&(view==='all'||item.who===view)&&item.status==='Erledigt').length;
  node('small',doneCount+' erledigt',head);
  const tasks=state.items.filter(item=>item.kind==='Aufgabe'&&(view==='all'||item.who===view))
    .sort((a,b)=>(a.day||'9999').localeCompare(b.day||'9999'));
  const list=node('div','',area);
  list.className='fitted-tasks';
  taskViewportWidth=document.documentElement.clientWidth;
  const height=taskViewportHeight=Math.round(window.visualViewport?.height||window.innerHeight);
  const remaining=Math.floor(height-(list.getBoundingClientRect().top+window.scrollY)-132);
  const capacity=Math.max(1,Math.floor(remaining/62));
  const pages=Math.max(1,Math.ceil(tasks.length/capacity));
  taskPage=Math.min(taskPage,pages-1);
  const shown=tasks.slice(taskPage*capacity,(taskPage+1)*capacity);
  list.style.setProperty('--task-height',Math.min(112,Math.max(56,Math.floor(remaining/Math.max(1,shown.length))-6))+'px');
  for(const item of shown)taskRow(item,list);
  if(!shown.length)node('p','Noch keine Aufgaben.',list).className='empty';
  const controls=node('div','',area);controls.className='bar task-pages';
  if(pages>1){
    button('‹',()=>{taskPage--;render();screen.querySelector('.next-page')?.focus()},controls).disabled=taskPage===0;
    node('span',(taskPage+1)+' / '+pages,controls);
    const next=button('›',()=>{taskPage++;render();screen.querySelector('.prev-page')?.focus()},controls);
    next.className='next-page';next.disabled=taskPage===pages-1;
    next.setAttribute('aria-label','Nächste Aufgabenseite');
    controls.firstElementChild.className='prev-page';
    controls.firstElementChild.setAttribute('aria-label','Vorherige Aufgabenseite');
  }
  if(undo)button('Rückgängig',()=>{undo.item.status=undo.status;undo=null;save();render()},controls);

}

async function shoppingRequest(action,data={}){
  if(!syncTokens.family)throw new Error('Aktiviere zuerst den Family-Zugang unter Kalendersynchronisation.');
  const response=await fetch('https://werhans-kalender.mathiaswerhan.workers.dev/shopping',{

    body:action?JSON.stringify({...data,action,device:shoppingDevice()}):undefined,
    signal:AbortSignal.timeout(10000)

async function refreshDayforce(key){
  if(dayforceLoading)return;

    const response=await fetch('https://werhans-kalender.mathiaswerhan.workers.dev/dayforce',{
      headers:{Authorization:'Bearer '+key},
      cache:'no-store',
      redirect:'error',
    });
    if(response.status===401){
      clearDayforceAccess();
      throw new Error('Familien-Zugangsschlüssel wurde abgelehnt.');

    dayforceKey=key;
    let remembered=true;

    dayforceShifts=data.shifts.map(shift=>({...shift,kind:'Termin',title:'Sindy · Lidl',dayforce:true}));

  } finally {
    dayforceLoading=false;
    if(view==='calendar')render();
  }

let syncStatus='';
async function sharedRequest(scope,method='GET',id='',data){
  const token=syncTokens[scope];
  if(!token)throw new Error('Aktiviere zuerst den Zugang unter Einstellungen → Kalendersynchronisation.');
  const response=await fetch('https://werhans-kalender.mathiaswerhan.workers.dev/events/'+scope+(id?'/'+id:''),{
    method,headers:{Authorization:'Bearer '+token,...(data?{'Content-Type':'application/json'}:{})},
    body:data?JSON.stringify(data):undefined,signal:AbortSignal.timeout(10000)
  });
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'Kalenderanfrage fehlgeschlagen.');

}
let refreshGeneration=0;
async function refreshShared(){
  const generation=++refreshGeneration;
  const results=await Promise.allSettled(syncScopes.map(async scope=>{
    const result=syncTokens[scope]?await sharedRequest(scope):{events:[]};
    return result.events.map(item=>({...item,calendarScope:scope}));
  }));
  if(generation!==refreshGeneration)return;
  const previous=JSON.stringify([syncStatus,sharedItems]);
  syncStatus='';
  results.forEach((result,index)=>{
    const scope=syncScopes[index];
    if(result.status==='fulfilled')sharedItems[scope]=result.value;
    else{
      sharedItems[scope]=[];
      syncStatus+=' '+calendarTypes[scope].label+' konnte nicht geladen werden.';
    }
  });
  if(view==='calendar'&&!editor.open&&previous!==JSON.stringify([syncStatus,sharedItems]))render();

function normalizeClock(value){
  const match=value.trim().match(/^(\d{1,2})(?::?(\d{2}))?$/);
  if(!match || Number(match[1])>23 || Number(match[2]||0)>59)return '';
  return match[1].padStart(2,'0')+':'+(match[2]||'00');
}
const clock=el('clock');
clock.oninput=()=>clock.setCustomValidity('');
clock.onblur=()=>{
  const formatted=normalizeClock(clock.value);
  if(formatted)clock.value=formatted;
};
for(const button of el('timeLabel').querySelectorAll('[data-minute]')){
  button.onclick=()=>{
    const current=normalizeClock(clock.value);
    if(!current){clock.focus();return}
    clock.value=current.slice(0,2)+':'+button.dataset.minute;
    clock.setCustomValidity('');
  };
}
let editingEvent=null;
const participantButtons=new Map();
for(const name of names){
  const choice=button('',()=>{
    choice.setAttribute('aria-pressed',String(choice.getAttribute('aria-pressed')!=='true'));
  },el('attendeeChoices'));
  choice.type='button';
  choice.className='attendee-choice';
  participantButtons.set(name,choice);
  const option=node('option',name,el('who'));option.value=name;
}
const reminder=el('reminder'), reminderAmount=el('reminderAmount'), reminderUnit=el('reminderUnit');
function reminderText(minutes){
  if(minutes%1440===0)return (minutes/1440)+(minutes===1440?' Tag vorher':' Tage vorher');
  if(minutes%60===0)return (minutes/60)+(minutes===60?' Stunde vorher':' Stunden vorher');
  return minutes+(minutes===1?' Minute vorher':' Minuten vorher');
}
function reminderFields(){
  const event=el('kind').value==='Termin';
  const custom=event&&reminder.value==='custom';
  el('reminderField').hidden=!event;
  el('customReminder').hidden=!custom;
  reminderAmount.disabled=!custom;
  reminderAmount.required=custom;
}
reminder.onchange=reminderFields;
function fields(){
  el('calendarScopeLabel').hidden=el('kind').value!=='Termin';
  reminderFields();
  const event=el('kind').value==='Termin';
  el('whoLabel').hidden=event;
  el('attendeeField').hidden=!event;
  el('timeLabel').hidden=!event;
  clock.disabled=!event;
  clock.setCustomValidity('');
  el('day').required=event;
  el('dayCaption').textContent=event?'Datum':'Fällig am (optional)';
}
el('kind').onchange=fields;
function openEditor(item=null){
  editingEvent=item;
  el('form').reset();
  el('editorTitle').textContent=item?'Termin bearbeiten':'Neuer Eintrag';
  el('kindLabel').hidden=Boolean(item);
  el('kind').value=item||view==='calendar'?'Termin':'Aufgabe';
  el('day').value=item?.day||(view==='calendar'?selectedDay:'');
  el('titleInput').value=item?.title||'';
  clock.value=item?.clock||'';
  const minutes=item?.reminderMinutes;
  if(minutes){
    reminder.value=String(minutes);
    if(!reminder.value){
      reminder.value='custom';
      const unit=minutes%1440===0?1440:minutes%60===0?60:1;
      reminderUnit.value=String(unit);
      reminderAmount.value=String(minutes/unit);
    }
  }
  el('who').value=names.includes(view)?view:names[0];
  for(const [name,choice] of participantButtons){
    choice.replaceChildren();
    avatar(name,choice);
    node('span',name,choice);
    choice.setAttribute('aria-pressed',String(item?Boolean(item.participants?.includes(name)):view===name));
  }
  el('calendarScope').value=item?.calendarScope||'private';
  el('calendarScope').disabled=Boolean(item?.revision);
  fields();
  editor.showModal();
}
el('add').onclick=()=>openEditor();
el('cancel').onclick=()=>editor.close();
editor.onclose=reset;
editor.addEventListener('cancel',event=>{
  if(el('cancel').disabled)event.preventDefault();
});
window.addEventListener('focus',()=>{if(view==='calendar')refreshShared()});
setInterval(()=>{if(view==='calendar'&&!document.hidden&&!editor.open)refreshShared()},30000);
el('form').onsubmit=async event=>{
  event.preventDefault();
  const title=el('titleInput').value.trim();
  if(!title)return;
  const kind=el('kind').value, who=el('who').value;
  const time=kind==='Termin'?normalizeClock(clock.value):'';
  if(kind==='Termin'&&clock.value.trim()&&!time){
    clock.setCustomValidity('Bitte eine Uhrzeit eingeben, zum Beispiel 0930 für 09:30.');
    clock.reportValidity();
    return;
  }
  const day=el('day').value;
  if(kind==='Termin'){
    const participants=names.filter(name=>participantButtons.get(name).getAttribute('aria-pressed')==='true');
    const reminderMinutes=reminder.value==='custom'?Number(reminderAmount.value)*Number(reminderUnit.value):Number(reminder.value);
    const details={title,day,clock:time,participants,reminderMinutes,calendarScope:el('calendarScope').value};
    if(syncScopes.includes(details.calendarScope)){
      if(editingEvent&&!editingEvent.revision&&!confirm('Diesen bisherigen Termin für '+calendarTypes[details.calendarScope].label+' freigeben?'))return;
      const form=el('form');
      const submit=form.querySelector('.primary');
      if(submit.disabled)return;
      const item=editingEvent;
      const id=item?.revision?item.id:crypto.randomUUID();
      submit.disabled=el('cancel').disabled=true;
      try{
        const result=await sharedRequest(details.calendarScope,'PUT',id,{...details,revision:item?.revision||0});
        if(item&&!item.revision){
          state.items=state.items.filter(entry=>entry!==item);
          save();
        }
        const entries=sharedItems[details.calendarScope];
        sharedItems[details.calendarScope]=[...entries.filter(entry=>entry.id!==id),
          {...details,id,kind,revision:result.revision}];
      }catch(error){
        alert(error.message);
        return;
      }finally{
        submit.disabled=el('cancel').disabled=false;
      }
    }else if(editingEvent)Object.assign(editingEvent,details);
    else state.items.push({id:Date.now(),kind,...details});
    selectedDay=day;
  }else{
    state.items.push({id:Date.now(),title,kind,who,status:'Offen',day,clock:''});
  }
  undo=null;
  save();
  editor.close();
  go(kind==='Termin'?'calendar':who);
};

function showFrame(){if(!photos.length||editor.open)return;clearTimeout(idle);clearInterval(ticker);let index=0;el('frame').hidden=false;el('slide').src=photos[index];ticker=setInterval(()=>{index=(index+1)%photos.length;el('slide').src=photos[index]},state.interval*1000)}
function reset(){clearTimeout(idle);if(state.wait&&photos.length&&el('frame').hidden&&!editor.open)idle=setTimeout(showFrame,state.wait*1000)}
el('frame').onclick=()=>{clearInterval(ticker);el('frame').hidden=true;go('home')};for(const event of ['pointerdown','keydown','input','scroll'])document.addEventListener(event,reset,{passive:true});
let taskResizeTimer;
const activePointers=new Set();
let taskViewportWidth;
let taskViewportHeight;
function resizeTasks(){
  clearTimeout(taskResizeTimer);
  taskResizeTimer=setTimeout(()=>{
    if(activePointers.size||!(view==='all'||names.includes(view))||editor.open||!el('frame').hidden)return;
    const width=document.documentElement.clientWidth;
    const height=Math.round(window.visualViewport?.height||window.innerHeight);
    if(width===taskViewportWidth&&height===taskViewportHeight)return;
    render();
  },150);
}
window.addEventListener('pointerdown',event=>activePointers.add(event.pointerId),true);
for(const type of ['pointerup','pointercancel']){
  window.addEventListener(type,event=>{
    activePointers.delete(event.pointerId);
    resizeTasks();
  },true);
}
window.addEventListener('blur',()=>{activePointers.clear();resizeTasks()});
window.addEventListener('resize',resizeTasks);
window.visualViewport?.addEventListener('resize',resizeTasks);
render();
refreshShopping();
</script></body></html>

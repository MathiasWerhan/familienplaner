<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Familienplaner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3ee;color:#193831;font:17px system-ui}main{max-width:820px;margin:auto;padding:24px 18px 110px}header,article,dialog{background:#fff;border:0;border-radius:24px;padding:20px;margin:12px 0}header{background:#183c32;color:#fff;padding:28px}h1{font-size:clamp(32px,7vw,56px);margin:0}h2,h3,p{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button,a,input,select{font:inherit}button,a{border:0;border-radius:14px;padding:12px;min-height:46px;background:#dce9df;color:#193831;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #276d55}button.profile{background:white;display:grid;justify-items:center;gap:7px;padding:20px 8px}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:bold;background:var(--c);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.bar{display:flex;gap:8px;flex-wrap:wrap}.new{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));right:18px;background:#183c32;color:white;z-index:1}dialog{margin:auto;width:min(94%,480px);max-height:90dvh;overflow:auto}dialog::backdrop{background:#10241dbb}label{display:grid;gap:5px;margin:12px 0}input,select{padding:10px;border:1px solid #82968b;border-radius:10px;width:100%}small{display:block;margin-top:8px}#frame{position:fixed;inset:0;z-index:4;background:#10241d;width:100%;height:100%;border-radius:0;padding:0}#frame img{width:100%;height:100%;object-fit:contain}[hidden]{display:none!important}
</style><main><header><h1>Familienplaner</h1><small>Entwurf · Daten auf diesem Gerät</small></header><section id="screen"></section><button class="new" id="add">＋ Neu</button></main>
<dialog id="editor"><form id="form"><h2>Neuer Eintrag</h2><label>Art<select id="kind"><option>Aufgabe</option><option>Termin</option></select></label><label>Titel<input id="titleInput" required maxlength="120"></label><label id="whoLabel">Für wen?<select id="who"></select></label><label>Datum<input type="date" id="day"></label><label id="timeLabel" hidden>Uhrzeit<input type="time" id="clock"></label><div class="bar"><button type="button" id="cancel">Abbrechen</button><button>Speichern</button></div></form></dialog>
<button id="frame" hidden aria-label="Zur Profilauswahl"><img id="slide" alt=""></button>
<script>
const names=['Matze','Sindy','Philipp','Robin'], colors=['#bedbff','#f7c8b9','#f6dc91','#c7e5b7'];
const el=id=>document.getElementById(id), screen=el('screen'), editor=el('editor');
const state=JSON.parse(localStorage.getItem('familienplaner-v1')||'null')||{items:[{id:1,kind:'Aufgabe',title:'Hunde füttern',who:'Robin',status:'Offen'}],avatars:{},wait:300,interval:30};
let view='home', undo, idle, ticker, photos=[];
function save(){localStorage.setItem('familienplaner-v1',JSON.stringify(state))}
function node(tag,txt,parent=screen){const n=document.createElement(tag);if(txt)n.textContent=txt;parent.append(n);return n}
function button(txt,fn,parent=screen){const b=node('button',txt,parent);b.onclick=fn;return b}
function go(next){view=next;render();reset()}
function row(item,parent){const card=node('article','',parent);node('h3',item.title,card);node('p',[item.day,item.clock,item.status].filter(Boolean).join(' · '),card);
if(item.kind==='Aufgabe'){const actions=node('div','',card);actions.className='bar';for(const status of ['Gesehen','Erledigt'])if(item.status!==status&&item.status!=='Erledigt')button(status,()=>{undo={item,status:item.status};item.status=status;save();render()},actions)}}
function render(){screen.replaceChildren();if(view==='home'){const grid=node('div');grid.className='grid';names.forEach((name,i)=>{const b=button('',()=>go(name),grid);b.className='profile';const icon=node('span',state.avatars[name]?'':name[0],b);icon.className='avatar';icon.style.setProperty('--c',colors[i]);if(state.avatars[name]){const img=node('img','',icon);img.src=state.avatars[name];img.alt=''}node('strong',name,b);node('span',state.items.filter(x=>x.who===name&&x.status!=='Erledigt').length+' offen',b)});const nav=node('article');nav.className='bar';button('Alle Aufgaben',()=>go('all'),nav);button('Kalender',()=>go('calendar'),nav);const link=node('a','Bring!',nav);link.href='https://web.getbring.com/login';link.target='_blank';link.rel='noopener';button('Einstellungen',()=>go('settings'),nav);return}
button('‹ Zur Profilauswahl',()=>go('home'));const area=node('article');if(view==='settings'){node('h2','Einstellungen',area);for(const name of names){const l=node('label','Profilbild · '+name,area);const f=node('input','',l);f.type='file';f.accept='image/*';f.onchange=async()=>{if(!f.files[0])return;try{state.avatars[name]=await resize(f.files[0],240);save()}catch{alert('Dieses Foto konnte nicht gespeichert werden.')}}}const label=node('label','Fotos für den Bilderrahmen (bis zu 100)',area);const upload=node('input','',label);upload.type='file';upload.accept='image/*';upload.multiple=true;const count=node('small',photos.length+' Fotos · für diese Sitzung',area);upload.onchange=()=>{if(!upload.files.length)return;photos.forEach(URL.revokeObjectURL);photos=Array.from(upload.files).slice(0,100).map(f=>URL.createObjectURL(f));count.textContent=photos.length+' Fotos · für diese Sitzung';reset()};
for(const [key,label] of [['wait','Start nach Sekunden (0 = aus)'],['interval','Bildwechsel nach Sekunden']]){const l=node('label',label,area),i=node('input','',l);i.type='number';i.min=key==='wait'?0:1;i.value=state[key];i.onchange=()=>{if(i.value!==''&&i.checkValidity()){state[key]=Number(i.value);save();reset()}else i.value=state[key]}}button('Diashow testen',()=>photos.length?showFrame():alert('Wähle zuerst Fotos aus.'),area);return}
if(view==='calendar'){node('h2','Family · Termine',area);const events=state.items.filter(i=>i.kind==='Termin').sort((a,b)=>(a.day+a.clock).localeCompare(b.day+b.clock));if(!events.length)node('p','Noch keine Termine.',area);events.forEach(x=>row(x,area));return}
node('h2',view==='all'?'Alle Aufgaben':view+' · Aufgaben',area);const done=node('label','Erledigte anzeigen',area), check=node('input','',done);check.type='checkbox';check.style.width='auto';const list=node('div','',area);
function draw(){list.replaceChildren();for(const name of view==='all'?names:[view]){if(view==='all')node('h3',name,list);const items=state.items.filter(x=>x.kind==='Aufgabe'&&x.who===name&&(check.checked||x.status!=='Erledigt')).sort((a,b)=>(a.day||'9999').localeCompare(b.day||'9999'));if(!items.length)node('p','Keine Aufgaben in dieser Ansicht.',list);items.forEach(x=>row(x,list))}}check.onchange=draw;draw();if(undo)button('Rückgängig',()=>{undo.item.status=undo.status;undo=null;save();render()},area)}
async function resize(file,size){const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');c.width=c.height=size;const s=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);return c.toDataURL('image/jpeg',0.8)}finally{URL.revokeObjectURL(url)}}
function fields(){const event=el('kind').value==='Termin';el('whoLabel').hidden=event;el('timeLabel').hidden=!event;el('day').required=event}
names.forEach(n=>{const o=node('option',n,el('who'));o.value=n});el('kind').onchange=fields;
el('add').onclick=()=>{el('form').reset();el('kind').value=view==='calendar'?'Termin':'Aufgabe';el('who').value=names.includes(view)?view:names[0];fields();editor.showModal()};
el('cancel').onclick=()=>editor.close();editor.onclose=reset;el('form').onsubmit=e=>{e.preventDefault();const title=el('titleInput').value.trim();if(!title)return;const kind=el('kind').value, who=el('who').value;state.items.push({id:Date.now(),title,kind,who:kind==='Aufgabe'?who:'',status:kind==='Aufgabe'?'Offen':'',day:el('day').value,clock:kind==='Termin'?el('clock').value:''});undo=null;save();editor.close();go(kind==='Termin'?'calendar':who)};
function showFrame(){if(!photos.length||editor.open)return;clearTimeout(idle);clearInterval(ticker);let index=0;el('frame').hidden=false;el('slide').src=photos[index];ticker=setInterval(()=>{index=(index+1)%photos.length;el('slide').src=photos[index]},state.interval*1000)}
function reset(){clearTimeout(idle);if(state.wait&&photos.length&&el('frame').hidden&&!editor.open)idle=setTimeout(showFrame,state.wait*1000)}
el('frame').onclick=()=>{clearInterval(ticker);el('frame').hidden=true;go('home')};for(const event of ['pointerdown','keydown','input','scroll'])document.addEventListener(event,reset,{passive:true});render();
</script></html>
